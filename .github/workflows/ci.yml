# Tests on PRs and main. Production deploys after tests on main when the
# matching GitHub secrets are set (see TakeoffDetectionCollector/README.md).
#
# Railway project shape lives in .railway/railway.ts (not railway.toml).
# Code still deploys from the GitHub source on the collector service.
# IaC plan/apply is .github/workflows/railway-config.yml.
#
# Do not use `secrets` in job/step `if:` — GitHub rejects the whole workflow
# at startup ("workflow file issue", 0 jobs). Gate deploys via env instead.
name: Collector

on:
  pull_request:
    paths:
      - "TakeoffDetectionCollector/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "TakeoffDetectionCollector/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: collector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TakeoffDetectionCollector/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: TakeoffDetectionCollector/backend/go.mod
          cache-dependency-path: TakeoffDetectionCollector/backend/go.sum
      - name: Test
        run: go test ./...
      # Smoke-check the Dockerfile. Railway Git is the real image build;
      # a Docker Hub 502 must not block frontend CD.
      - name: Build image
        continue-on-error: true
        run: docker build -t collector .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TakeoffDetectionCollector/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TakeoffDetectionCollector/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://collector.example.invalid
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

  deploy-frontend:
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        id: vercel
        run: |
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n')
          VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\r\n')
          VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\r\n')
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$VERCEL_ORG_ID" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID" >> "$GITHUB_ENV"
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel deploy (missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID)"
          fi
      - uses: actions/setup-node@v4
        if: steps.vercel.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install Vercel CLI
        if: steps.vercel.outputs.ok == 'true'
        run: npm install --global vercel@latest
      # Write project.json instead of `vercel link`. Link hits GET /v2/user,
      # which team- and project-scoped tokens cannot call (User not found).
      - name: Pull env
        if: steps.vercel.outputs.ok == 'true'
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.vercel.outputs.ok == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.vercel.outputs.ok == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backend:
    needs: [backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway token
        id: railway
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Railway CLI deploy (RAILWAY_TOKEN unset; Git source still deploys)"
          fi
      - name: Install Railway CLI
        if: steps.railway.outputs.ok == 'true'
        run: npm install --global @railway/cli
      - name: Deploy
        if: steps.railway.outputs.ok == 'true'
        working-directory: TakeoffDetectionCollector/backend
        run: |
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            railway up --ci --service "$RAILWAY_SERVICE_ID"
          else
            railway up --ci
          fi
